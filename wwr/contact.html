<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
      content="Contact White Water Rafting for reservations, questions, suggestions, and information about our rafting adventures.">

    <meta name="author" content="Alfredo Cassanje">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1>Contact White Water Rafting</h1>

            <div class="contact-details">
                <p><strong>Address:</strong> 123 River Road, Adventure City</p>
                <p><strong>Phone:</strong> +244 900 000 000</p>
                <p><strong>Email:</strong> info@whitewaterrafting.com</p>
            </div>

            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=" loading="lazy" allowfullscreen>
                </iframe>
            </div>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <div class="employees-gallery">

                <figure>
                    <img src="images/employees1.jpg" alt="Operations Manager">
                    <figcaption>Eunice Paquete - Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employees2.jpg" alt="Safety Instructor">
                    <figcaption>Alfredo Cassanje - Safety Instructor</figcaption>
                </figure>

                <figure>
                    <img src="images/employees3.jpg" alt="Senior Rafting Guide">
                    <figcaption>Emily Davis - Senior Rafting Guide</figcaption>
                </figure>

            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>

                <label for="fullname">Name</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <input type="radio" id="general" name="purpose" value="general" required>
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>

                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">
                    Send Message
                </button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Alfredo Cassanje</p>

        <nav class="socialmedia">
            <a href="#">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="#">
                <img src="images/instagram.png" alt="Instagram">
            </a>

            <a href="#">
                <img src="images/twitter.png" alt="Twitter">
            </a>
        </nav>
    </footer>

</body>

</html>
